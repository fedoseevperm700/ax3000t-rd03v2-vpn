# Буферы сокетов: по умолчанию ядро разрешает им до ~50 МБ (UDP 33 + TCP 16),
# а программам на этом роутере доступно ~60 МБ. Ограничиваем (в страницах по 4 КБ):
# UDP до 8 МБ (сверх лимита UDP-пакеты просто отбрасываются), TCP до 12 МБ
# (при нехватке TCP уменьшает окна, соединения не рвутся).
net.ipv4.udp_mem = 1024 1536 2048
net.ipv4.tcp_mem = 1536 2048 3072
