name: Сборка прошивки AX3000T RD03V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Установить зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Собрать
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      - name: Собрать файлы прошивки
        id: collect
        run: |
          set -e
          BIN=work/rd03v2/openwrt/bin/targets/qualcommax/ipq50xx
          mkdir -p out
          cp $BIN/*xiaomi_mi-router-ax3000t-v2*initramfs-uImage.itb out/
          cp $BIN/*xiaomi_mi-router-ax3000t-v2*squashfs-sysupgrade.bin out/
          cp $BIN/*xiaomi_mi-router-ax3000t-v2*.manifest out/ || true
          cp work/rd03v2/openwrt/.config out/build.config
          (cd out && sha256sum *.itb *.bin > sha256sums.txt)
          ls -l out
          cat out/sha256sums.txt
          echo "tag=build-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Выложить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ax3000t-rd03v2
          path: out/

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.collect.outputs.tag }}" out/* \
            --title "AX3000T RD03V2 + AmneziaWG 3.1 + Podkop (${{ steps.collect.outputs.tag }})" \
            --notes-file RELEASE_NOTES.md

      - name: Лог ошибок при сбое
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            work/rd03v2/openwrt/logs/
            work/rd03v2/openwrt/.config
          if-no-files-found: ignore
